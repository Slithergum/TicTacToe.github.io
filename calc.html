<!doctype html>
<html>
  <head>
    <title></title>
    <link rel="stylesheet" href="style.css">
  </head>

  <style>
    *{
  font-weight: bold;
  font-size: 20px;
  font-family: sans-serif;
  overflow: hidden;
}
.mainDiv{
  position: relative;
  top: -270px;
}
button{
  
  background-color: gray;
  color: black;
  border-radius: 10px;
  margin-right:5px;
  margin-left: -2.5px;
  margin-block: 5px;
  padding-inline: 13vw;
  padding-block: 3vh;
}

button:active{
  background-color: cyan;
}
div{
  position: relative;
  margin-block: 100px;
  top: 50px;
}
table{
  position: relative;
  bottom: 20px
  paddin-block: 10px;
}
input{
  padding-block: 10px;
  padding-inline: 12px;
  border: 1px solid gray;
  border-radius: 5px 0px 5px 0px;
}
.mult{
  background-color: orange;
}
.add{
  background-color: limegreen;
}
.sub{
  background-color: pink;
}
  </style>
  <body>
    <div align=center class="mainDiv">
    <div align=center>
      <h3>CodRex Calculator</h3>
      <input id="input" type="text" value="" />
    </div>
    <div align=center>
      
    <table>
      <tr>
        <td><button id="btn1">1</button></td>
        <td><button id="btn2">2</button></td>
        <td><button id="btn3">3</button></td>
      </tr>
      <tr>
        <td><button id="btn4">4</button></td>
        <td><button id="btn5">5</button></td>
        <td><button id="btn6">6</button></td>
      </tr>
      <tr>
        <td><button id="btn7">7</button></td>
        <td><button id="btn8">8</button></td>
        <td><button id="btn9">9</button></td>
      </tr>
      <tr>
        <td><button id="clear">C</button></td>
        <td><button id="btn0">0</button></td>
        <td><button id="eq">=</button></td>
      </tr>
      <tr class="operator">
        <td colspan=""><button class="mult" id="mult">x</button></td>
        <td colspan=""><button class="sub" id="sub">-</button></td>
        <td colspan=""><button class="add" id="add">+</button></td>
      </tr>
    </table>
      </div>
      </div>
    <script>

      const inputBar=document.getElementById("input");
let mult=document.getElementById("mult");
let sub=document.getElementById("sub");
let add=document.getElementById("add");
let clr=document.getElementById("clear");
let equals=document.getElementById("eq");
let btn1=document.getElementById("btn1");
let btn2=document.getElementById("btn2");
let btn3=document.getElementById("btn3");
let btn4=document.getElementById("btn4");
let btn5=document.getElementById("btn5");
let btn6=document.getElementById("btn6");
let btn7=document.getElementById("btn7");
let btn8=document.getElementById("btn8");
let btn9=document.getElementById("btn9");
let btn0=document.getElementById("btn0");


var tempInputValue=0;

mult.onclick=function(){
  tempInputValue = "*";
  inputBar.value = inputBar.value+tempInputValue;
}
add.onclick=function(){
  tempInputValue = "+";
  inputBar.value = inputBar.value+tempInputValue;
}
sub.onclick=function(){
  tempInputValue = "-";
  inputBar.value = inputBar.value+tempInputValue;
}

clr.onclick=function(){

  inputBar.value = "";
}

btn1.onclick=function(){
  tempInputValue = 1;
  inputBar.value = inputBar.value+tempInputValue;
}

btn2.onclick=function(){
  tempInputValue = 2;
  inputBar.value = inputBar.value+tempInputValue;
}

btn3.onclick=function(){
  tempInputValue = 3;
  inputBar.value = inputBar.value+tempInputValue;
}

btn4.onclick=function(){
  tempInputValue = 4;
  inputBar.value = inputBar.value+tempInputValue;
}

btn5.onclick=function(){
  tempInputValue = 5;
  inputBar.value = inputBar.value+tempInputValue;
}

btn6.onclick=function(){
  tempInputValue = 6;
  inputBar.value = inputBar.value+tempInputValue;
}

btn7.onclick=function(){
  tempInputValue = 7;
  inputBar.value = inputBar.value+tempInputValue;
}

btn8.onclick=function(){
  tempInputValue = 8;
  inputBar.value = inputBar.value+tempInputValue;
}

btn9.onclick=function(){
  tempInputValue = 9;
  inputBar.value = inputBar.value+tempInputValue;
}

btn0.onclick=function(){
  tempInputValue = 0;
  inputBar.value = inputBar.value+tempInputValue;
}

equals.onclick=function(){
  let equals = 0;
  equals = eval(inputBar.value);
  inputBar.value = equals;
}



      
    </script>
  </body>
</html>
