<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div>
      
      <div>
        <p class="time" id="currentTime"></p>
      </div>

      <div class="headerCont" align=center>
        <img height="150px" width="150px" src="https://img.favpng.com/22/20/25/beauty-woman-silhouette-black-silhouette-of-a-woman-with-elegant-hairstyle-k7YVXXes.jpg" alt="image" />
        <h1 class="title">ELEGANT FILIPINA HAIR</h1>  
      </div>  
      
      <div>
        <div class="category">
          <p>Single Drawn</p>
          <p>Double Drawn Straight</p>
          <p>Natural Wavy</p>
          <p>Single Drawn Steam</p>
          <p>Double Drawn Steam</p>
        </div>
      </div>

      <div align=center class="container">
        <img src="" alt="image" />
        <img src="" alt="image" />
        <img src="" alt="image" />
        <img src="" alt="image" />
        <img src="" alt="image" />
        <img src="" alt="image" />
        <img src="" alt="image" />

      </div>
  
    </div>
      
      <style type="text/css" media="all">
        .{
          margin: 0;
          padding: 0;
          font-family: sans-serif;
        }
        body{
          background-color: rgb(60, 29, 64);
        }
        .time{
          font-family:sans-serif;
          font-size: 11px;
          color: white;
        }
        .headerCont{
          background-color:rgb(237, 9, 237);
          padding-block: 30px;
          border-radius: 0px 0px 40px 40px;
          display: flex;
          flex-direction: row; 
          padding-inline:50px;
          
        }
        .headerCont h1{
          color:Gold;
          margin:50px;
        }
        img{
          border-radius:50%;
        }
        .category{
          display: flex;
          flex-direction: row;
        }
        .category p{
          color:white;
          border-radius:20px;
          margin:10px;
          text-align:center;
          align-items:center;
          width: 22vw;
          font-size:13px;
          padding-block: 2vh;
          border:1px none black;
          font-family:sans-serif;
          background-color:rgb(237, 9, 250);
        }
        .category p:hover{
          cursor: pointer;
          background-color:rgb(105, 42, 128);
          transition: 500ms;
          
        }
        .category p:active{
          transform:scale(.9,.9);
          transition: 10ms ;
        }
        .container{
          background-color:rgb(237, 9, 237);
          display: flex;
          flex-direction: column; 
          align-items: center;
          border-radius: 40px 40px 40px 40px;
        }

        .container img{
          border:1px solid black;
          height: 10vh;
          width:30vw;
        }


      </style>

      <script src="script.js"></script>
  </body>
</html>
