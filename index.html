<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe: Next Gen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #222;
            color: white;
            margin-top: 50px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin-top: 20px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
        }
        .cell:hover { background-color: #555; }

      a{
        padding-block: 10px;
        padding-inline: 30px;
        border-radius: 20px;
        width: 300px;
        background-color: gray;
        text-decoration: none;
        color: white;
      }
        #video, #canvas { display: none; }
        
           .vrfyCont{
        width: 1000px;
        height: 1000px;
        background-color: rgba(29, 30, 31, 0.8);
        align-items: center;
        position: relative;
        bottom: 600px;
      
      }
      .vrfy{
        position: relative;
        top: 300px;
      } 
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <p><em>This is 2 player game!</em></p>
    
    <div class="board" id="board">
        
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
    </div>
  <br>
  <br>
  <br>
  <div align=center><a href="aimode.html">Wanna try AI MODE 🤖?</a>
    
    <br>
  <br>
  <br>
    Note: Permission is required for Age verification!
</div>

    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <div class="vrfyCont" id="vrfyCont" align=center>
     <h3 id="vrfy" class="vrfy"> Verifying Age</h3>
  </div>

    <script src="jsForIndex.js"></script>
</body>
</html>
