<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe: Next Gen</title>
    <style>
        body {
            overflow:hidden;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #222;
            color: white;
            margin-top: 50px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            margin-top: 20px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            cursor: pointer;
        }
        .cell:hover { background-color: #555; }

      a{
        padding-block: 10px;
        padding-inline: 30px;
        border-radius: 20px;
        width: 300px;
        background-color: gray;
        text-decoration: none;
        color: white;
        margin-block: 20px;
      }
        #video, #canvas { display: none; }
        
           .vrfyCont{
        width: 1000px;
        height: 1000px;
        background-color: rgba(29, 30, 31, 0.8);
        align-items: center;
        position: relative;
        bottom: 700px;
        display:none;
      
      }
      .vrfy{
        position: relative;
        top: 300px;
      } 
      
    .fdMainDiv{
        overflow: hidden;
        padding-block: 100vh;
        padding-inline: 200vw;
        position: relative;
        background-color: rgba(47, 58, 74, 0.8);
        bottom: 1250px;
        display: none;
        
      }
      .feedbackCont{
        border-radius: 30px;
        align-content: center;
        background-color: gray;
        padding-inline: 70px;
        padding-block: 70px;
        padding-block-start: 50px;
        width: 180px;
        height: 200px;
      }
      .feedbackCont input{
        width: 170px;
        height: 20px;
      }
      .txtArea{
        height: 150px;
        width: 170px;
      }
      .red-placeholder::placeholder{
        color: red;
      }

      @keyframes fd{
        from{opacity:0%;}
        to{opacity: 100%;}
      }
    
    </style>
</head>
<body>
    <button id="feedBtn" class="fdbtn">feedback</button>
    <h1>Tic-Tac-Toe</h1>
    <p><em>This is 2 player game!</em></p>
    
    <div class="board" id="board">
        
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        <div class="cell" onclick="makeMove(this)"></div>
        </div>
  
  <br>
  <div align=center>
    <a href="aimode.html">Wanna try AI MODE 🤖?</a>
    <br>
    <br>
    <br>
    <a href="calc.html">Go to my Calculator ?</a>
  <br>
  <br>
    Note: Permission is required for Age verification!
</div>

    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <div class="vrfyCont" id="vrfyCont" align=center>
     <h3 id="vrfy" class="vrfy"> Verifying Age</h3>
  </div>

  <div align=center class="fdMainDiv" id="fdMainDiv">
  <div align=center class="feedbackCont">
   <input id="email" type="email" placeholder="email" required />
    <br><br>
    <textarea id="txtArea" class="txtArea" placeholder="Type your feedback here..."></textarea>
    <br>
    <br>
    <button id="subBtn" type="submit">Send feedback</button>
  </div>
    </div>

    <script src="jsForIndex.js"></script>
</body>
</html>
